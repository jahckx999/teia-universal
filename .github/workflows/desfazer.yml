name: Desfazer pedido
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: desfazer
  cancel-in-progress: false
jobs:
  desfazer:
    # Só o dono do repositório pode desfazer
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'desfazer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desfazer as alterações do pedido
        env:
          GH_TOKEN: ${{ github.token }}
          CORPO: ${{ github.event.issue.body }}
          TITULO: ${{ github.event.issue.title }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "jahckx999"
          git config user.email "jahckx999@users.noreply.github.com"
          node scripts/desfazer.mjs
