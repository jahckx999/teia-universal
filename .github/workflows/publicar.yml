name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"   # rebuild diário (datas e status sempre atuais)
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Garantir rótulos do painel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for l in "novo-tema:e9c67e" "melhorar:b9a6ff" "atualizar:8fdcff" "problema:ff7878" "sugestao-leitor:8d89ad" "aprovado:6edc8c" "urgente:ff9f7a" "diagnostico:ffd59a" "feito:2ea043" "pedido:d4af37" "em-andamento:f0b429" "lote:c9a0ff" "desfazer:ff9f7a" "desfeito:8d89ad"; do
            gh label create "${l%%:*}" --color "${l##*:}" --force -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
      - name: Gerar site e diagnosticar
        run: node scripts/build.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
